[package]
name = "phi-kernel-tools"
version = "0.4.0"
edition = "2024"
description = "Kernel tools for phi-agent — file system, multi-agent, and shell tools"
license = "MIT"
repository = "https://github.com/hibuka-labs/phi-kernel-tools"
keywords = ["agent", "ai", "llm", "tool-calling"]
categories = ["development-tools", "asynchronous"]

[features]
default = []
full = ["multi-agent", "shell", "file"]
file = []
multi-agent = []
shell = []

[dependencies]
agent-base = { version = "0.3.1" }
agent-works = { version = "0.4.1", features = ["multi_agent"] }
async-trait = "0.1"
ignore = "0.4"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = { version = "1", features = ["derive"] }
tokio = { version = "1.52", features = ["full"] }
tokio-util = "0.7"
tracing = "0.1"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
futures-core = "0.3"
futures-util = "0.3"
tempfile = "3"
tokio = { version = "1.52", features = ["full"] }

[[bench]]
name = "file_tools"
harness = false
required-features = ["file"]
